name: Deploy PhiCloneLab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    name: Package the static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check deployable entry points
        run: |
          test -f site/index.html
          test -f site/atlas.html
          test -f site/data/research.json
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
  deploy:
    name: Deploy the previously uploaded artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 15); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            echo "Pages artifacts visible: ${count} (attempt ${attempt}/15)"
            if [ "$count" = "1" ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ] 2>/dev/null; then
              echo "::error::Duplicate github-pages artifacts. Re-run the failed deploy job only, not the entire workflow."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Pages artifact unavailable after checking for 75 seconds."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
